[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stimator"
dynamic = ["version"]
description = "Analysis of ODE models with focus on model selection and parameter estimation."
readme = "README.md"
requires-python = ">=3.12"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "António Ferreira"},
]
keywords = [
    "ODE-models",
    "dynamics",
    "estimation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Life",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "matplotlib>=2.0",
    "numpy",
    "scipy",
    "sympy",
    "packaging",
    "dotmap",
]

[tool.hatch.version]
path = "src/stimator/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/stimator"]

[tool.hatch.build.targets.sdist]
include = [
  "src/stimator",
  "README.md",
  "LICENSE",
  "pyproject.toml",
]

[tool.hatch.envs.default]
installer = "uv"

[project.urls]
Homepage = "https://github.com/aeferreira/stimator"
"Repository" = "https://github.com/aeferreira/stimator"



